<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1023">
<title>Gestión Sweet Dreams</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono.png">
<link rel="apple-touch-icon" href="icono.png">
<link rel="stylesheet" href="estilos.css?v=2">
<style>
  /* Logo de Sweet Dreams: solo en la pantalla de entrada */
  .logo {
    display: none; width: 100%; max-width: 460px; margin: 8px auto 4px;
    aspect-ratio: 2457 / 640; object-fit: cover; mix-blend-mode: lighten;
  }
  body:has(#lUsuario) .logo { display: block; }
  body:has(#lUsuario) header { display: none; }
</style>
</head>
<body>
  <div id="carga" class="carga">Cargando…</div>

  <div class="app oculto" id="app">
    <img class="logo" src="SAVE_20250830_140346.jpg" alt="Sweet Dreams. Music, friends">
    <header>
      <h1 id="titulo">Sweet Dreams</h1>
      <div class="quien" id="quien">Gestión interna</div>
    </header>
    <nav id="pestanas" class="pestanas oculto"></nav>
    <div id="mensaje"></div>
    <main id="contenido"></main>
    <footer class="pie">Gestión Sweet Dreams, versión 2</footer>
  </div>

  <nav id="barra" class="barra oculto"></nav>

  <script type="module" src="app.js?v=6"></script>
</body>
</html>
